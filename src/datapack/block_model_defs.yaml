block_models:
  $target: lunar_origins/models/block
  $type: block

  light_orb:
    ambientocclusion: false
    render_type: cutout
    #textures:
    #  particle: minecraft:particle/glow

  kelp_bed:
    parent: minecraft:block/block
    render_type: cutout
    textures:
      particle: minecraft:block/kelp_plant
      top: lunar_origins:block/kelp_bed_top
      side: lunar_origins:block/kelp_bed_side
      bottom: lunar_origins:block/kelp_bed_bottom
      cross: minecraft:block/seagrass
    elements:
      - from: [0, 0, 0]
        to: [16, 4, 16]
        faces:
          down: { uv: [0, 0, 16, 16], texture: "#bottom", cullface: "down"}
          up: { uv: [0, 0, 16, 16], texture: "#top" }
          north: { uv: [0, 4, 16, 16], texture: "#side", cullface: "north"}
          south: { uv: [0, 4, 16, 16], texture: "#side", cullface: "south"}
          east: { uv: [0, 4, 16, 16], texture: "#side", cullface: "east"}
          west: { uv: [0, 4, 16, 16], texture: "#side", cullface: "west"}

      - from: [0, 4, 4]
        to: [16, 20, 4]
        shade: false
        faces:
          north: { uv: [0, 0, 16, 16], texture: '#cross'}
          south: { uv: [ 0, 0, 16, 16 ], texture: '#cross' }
      - from: [12, 4, 0]
        to: [12, 20, 16]
        shade: false
        faces:
          west: { uv: [ 0, 0, 16, 16 ], texture: '#cross' }
          east: { uv: [ 0, 0, 16, 16 ], texture: '#cross' }
      - from: [4, 4, 0]
        to: [4, 20, 16]
        shade: false
        faces:
          west: { uv: [ 0, 0, 16, 16 ], texture: '#cross' }
          east: { uv: [ 0, 0, 16, 16 ], texture: '#cross' }
      - from: [0, 4, 12]
        to: [16, 20, 12]
        shade: false
        faces:
          north: { uv: [ 0, 0, 16, 16 ], texture: '#cross' }
          south: { uv: [ 0, 0, 16, 16 ], texture: '#cross' }

  kelp_bed_head:
    parent: lunar_origins:block/kelp_bed
    textures:
      top: lunar_origins:block/kelp_bed_top_head

block_states:
  $target: lunar_origins/blockstates
  $type: blockstates

  light_orb: lunar_origins:block/light_orb
  kelp_bed:
    variants:
      "part=head,facing=north":
        model: lunar_origins:block/kelp_bed_head
      "part=head,facing=south":
        model: lunar_origins:block/kelp_bed_head
        y: 180
      "part=head,facing=east":
        model: lunar_origins:block/kelp_bed_head
        y: 90
      "part=head,facing=west":
        model: lunar_origins:block/kelp_bed_head
        y: 270

      "part=foot,facing=north":
        model: lunar_origins:block/kelp_bed
      "part=foot,facing=south":
        model: lunar_origins:block/kelp_bed
        y: 180
      "part=foot,facing=east":
        model: lunar_origins:block/kelp_bed
        y: 90
      "part=foot,facing=west":
        model: lunar_origins:block/kelp_bed
        y: 270
